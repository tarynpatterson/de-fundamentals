[project]
name = "dekit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TarynPatterson", email = "tarynleeshaep@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.6",
]

[project.scripts]
dekit = "dekit.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]